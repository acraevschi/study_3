    lemmas: [sivaltaa]
    reason: "truncated form in the MGN data (sival: the endings -si-vat are missing)"
  - cells: [IMP.2PL]
    lemmas: [tukahtua, takaisinmallintaa]
    reason: "truncated form in the MGN data (tukah, takaisinmallin: the ending -kaa is missing)"

