# P5/D31: defective only where VISK says the person forms do not exist. Weather verbs other than
# tuulla have 'rajoittunut subjektin valinta' (VISK 457), so their data forms are kept.
defective:
  - cells: [PRS.1SG, PRS.2SG, PRS.1PL, PRS.2PL, PRS.3PL, PST.1SG, PST.2SG, PST.1PL, PST.2PL, PST.3PL, IMP.2SG, IMP.2PL]
    lemmas: [tuulla]
    reason: "tuulla is always subjectless, so its only person form is the 3SG (VISK 457)"
    reference: {"author": "Hakulinen et al. (VISK; online edition, Kotus)", "year": 2004, "locus": "§457 Milloin verbi taipuu vain 3. persoonassa?; read in the Internet Archive copy https://web.archive.org/web/2023/https://kaino.kotus.fi/visk/sisallys.php?p=457; \"vain pieni osa niistä on aina subjektittomia ja sikäli yksipersoonaisia, esim. tuulla\"", "locus_verified": true}
  - cells: [PRS.1SG, PRS.2SG, PRS.1PL, PRS.2PL, PST.1SG, PST.2SG, PST.1PL, PST.2PL, IMP.2SG, IMP.2PL]
    lemmas: [tapahtua, halveta, raikua, virrata, janottaa]
    reason: "VISK 457 names these as verbs whose person inflection is restricted to the 3rd person (inanimate subject); 1st and 2nd person (and so the imperative) are impossible for semantic reasons"
    reference: {"author": "Hakulinen et al. (VISK; online edition, Kotus)", "year": 2004, "locus": "§457 Milloin verbi taipuu vain 3. persoonassa?; read in the Internet Archive copy https://web.archive.org/web/2023/https://kaino.kotus.fi/visk/sisallys.php?p=457; \"Persoonataivutus voi rajoittua kolmanteen persoonaan\"", "locus_verified": true}

  - cells: [IMP.2SG, IMP.2PL]
    lemmas: [voida, taitaa]
    reason: "VISK 1590: modal verbs cannot form an imperative; it names taida (taitaa) and täydy (täytyä, not in the data), and VISK 1352 lists voida as a central modal verb (D31 follows the grammar)"
    reference: {"author": "Hakulinen et al. (VISK; online edition, Kotus)", "year": 2004, "locus": "§1590 Modukset ja niiden suhde modaalisuuden lajeihin; read in the Internet Archive copy https://web.archive.org/web/2023/https://kaino.kotus.fi/visk/sisallys.php?p=1590; \"Kaikista verbeistä ei voi muodostaa imperatiivia. Tällaisia ovat ensinnäkin modaaliverbit\" (examples *taida mennä, *täydy osata); §1352 lists voida among the central modal verbs", "locus_verified": true}

data_gaps:
  - cells: [PST.1SG, PST.2SG, PST.3SG]
    lemmas: [hyytää, häätää, joutaa, kiitää, kyntää, liitää, noutaa, sortaa, soutaa, vuotaa]
    reason: "glued doublet in the MGN data (two past forms run together, e.g. lähdinläksin); the standard form cannot be separated by the tool"
  - cells: [PST.1SG, PST.2SG, PST.3SG, PST.1PL, PST.2PL, PST.3PL]
    lemmas: [lähteä, entää, yltää]
    reason: "glued doublet in the MGN data (two past forms run together, e.g. lähdinläksin); the standard form cannot be separated by the tool"
  - cells: [PRS.1PL]
    lemmas: [ammentaa, lemmiskellä, ummehtua]
    reason: "truncated form in the MGN data (ammenn, lemmiske, ummehd: the ending -mme is missing)"
