# Paradigm cell filling (PCFP) with an LDL selector; Italian and Finnish verbs (MGN, orth).
# Every value here is declared before any selection or outer-test fit (docs/PROTOCOL.md).
# Supersedes the source-known new-verb task of configs/pilot.yaml (pilot_v1, code state
# 24390cf). Change by copying the file.
# ARCHIVED (pcfp_v1, completed 2026-10-08 at commit 9c4ee53, config hash 8b088277dfaa1e26).
# `cv.design: core_selected` was added afterwards, when repeated_random became the default
# design (configs/pcfp_v2.yaml); it keeps this file running the same design with later code.
# The added key changes the config hash; the pcfp_v1 outputs record the original one.

experiment:
  id: pcfp_v1
  master_seed: 20261008
  description: >
    Paradigm cell filling: every verb is known from k shown forms (k ~ U{1..min(7, n_cells-1)},
    drawn once per verb) and LDL fills its hidden cells. Fixed core verbs per fold carry the
    primary test items; selected verbs (shared seed + active or random acquisition) complete
    the training sample. The LDL model itself is the active-selection model.

paths:
  repo_root: .
  mgn_data: mgn_data/data
  mgn_custom: mgn_data/data-custom
  gelato_audit: analyses/gelato_feasibility_2026_10_01
  outputs: outputs
  external: external

resources:
  ingest:                             # same ingest set as pilot_v1 -> same group ids
    - {adapter: mgn_wide, file: ita-v.csv, iso: ita, pos: V, representation: orth}
    - {adapter: mgn_wide, file: fin-v.csv, iso: fin, pos: V, representation: orth}

task:
  name: pcfp
  cell_rule:
    # Declared before any run. A cell is eligible if at most `max_multiword_share` of its
    # variant-0 non-missing forms (over non-derived lemmas) are multiword; any remaining
    # multiword form counts as unavailable. The resulting lists are written into `units`
    # below and the splits stage refuses to run if the data disagree.
    max_multiword_share: 0.5
  eligibility:
    exclude_derived_paradigms: true   # eligibility/<unit>_derived_paradigms.csv (pronominal/clitic, idioms)
    require_complete_paradigm: true   # every eligible cell non-missing and single-word at variant 0
  exposure:
    max_shown: 7                      # same cap in every language: k ~ U{1..min(7, n_cells(v)-1)}
    k_distribution: uniform
    shown_cells: uniform_without_replacement
  citation_cell_rule: exclude_from_test   # the citation cell may be shown (counted in k) but is never a test item
  variant_policy: first_for_training_any_for_eval

units:
  - unit_id: ita.V.orth.mgn
    resource_id: "mgn_data:ita-v"
    role: substantive
    citation_cell: NFIN
    cells: ['1;COND;PL', '1;COND;SG', '1;FUT;IND;PL', '1;FUT;IND;SG', '1;IMP;PL;POS', '1;IND;IPFV;PL;PST',
            '1;IND;IPFV;PST;SG', '1;IND;PFV;PL;PST', '1;IND;PFV;PST;SG', '1;IND;PL;PRS', '1;IND;PRS;SG',
            '1;PL;PRS;SBJV', '1;PL;PST;SBJV', '1;PRS;SBJV;SG', '1;PST;SBJV;SG', '2;COND;PL', '2;COND;SG',
            '2;FUT;IND;PL', '2;FUT;IND;SG', '2;IMP;PL;POS', '2;IMP;POS;SG', '2;IND;IPFV;PL;PST',
            '2;IND;IPFV;PST;SG', '2;IND;PFV;PL;PST', '2;IND;PFV;PST;SG', '2;IND;PL;PRS', '2;IND;PRS;SG',
            '2;PL;PRS;SBJV', '2;PL;PST;SBJV', '2;PRS;SBJV;SG', '2;PST;SBJV;SG', '3;COND;PL', '3;COND;SG',
            '3;FUT;IND;PL', '3;FUT;IND;SG', '3;IMP;PL;POS', '3;IMP;POS;SG', '3;IND;IPFV;PL;PST',
            '3;IND;IPFV;PST;SG', '3;IND;PFV;PL;PST', '3;IND;PFV;PST;SG', '3;IND;PL;PRS', '3;IND;PRS;SG',
            '3;PL;PRS;SBJV', '3;PL;PST;SBJV', '3;PRS;SBJV;SG', '3;PST;SBJV;SG', 'NFIN']   # 48 (all MGN cells)
  - unit_id: fin.V.orth.mgn
    resource_id: "mgn_data:fin-v"
    role: substantive
    citation_cell: NFIN
    cells: ['1;ACT;COND;PL;POS;PRS', '1;ACT;COND;POS;PRS;SG', '1;ACT;IMP;PL;POS;PRS', '1;ACT;IND;PL;POS;PRS',
            '1;ACT;IND;PL;POS;PST', '1;ACT;IND;POS;PRS;SG', '1;ACT;IND;POS;PST;SG', '1;ACT;PL;POS;POT;PRS',
            '1;ACT;POS;POT;PRS;SG', '2;ACT;COND;PL;POS;PRS', '2;ACT;COND;POS;PRS;SG', '2;ACT;IMP;PL;POS;PRS',
            '2;ACT;IMP;POS;PRS;SG', '2;ACT;IND;PL;POS;PRS', '2;ACT;IND;PL;POS;PST', '2;ACT;IND;POS;PRS;SG',
            '2;ACT;IND;POS;PST;SG', '2;ACT;PL;POS;POT;PRS', '2;ACT;POS;POT;PRS;SG', '3;ACT;COND;PL;POS;PRS',
            '3;ACT;COND;POS;PRS;SG', '3;ACT;IMP;PL;POS;PRS', '3;ACT;IMP;POS;PRS;SG', '3;ACT;IND;PL;POS;PRS',
            '3;ACT;IND;PL;POS;PST', '3;ACT;IND;POS;PRS;SG', '3;ACT;IND;POS;PST;SG', '3;ACT;PL;POS;POT;PRS',
            '3;ACT;POS;POT;PRS;SG', 'COND;PASS;POS;PRS', 'IMP;PASS;POS;PRS', 'IND;PASS;POS;PRS',
            'IND;PASS;POS;PST', 'NFIN', 'PASS;POS;POT;PRS']      # 35 of 137 (102 mainly multiword)

cv:
  design: core_selected               # per-fold seed + active/random acquisition (pcfp_v1)
  inventory_size: 1200                # eligible lemmas drawn by group (inventory seed)
  n_folds: 3
  repetitions: [0]                    # one repetition: core sets are disjoint across its folds
  core_size: 100                      # C: per-fold core verbs (whole groups), disjoint across folds
  dev_size: 0                         # no dev role: LDL is fitted in closed form (no early stopping)
  seed_size: 20
  pool_cap: 500
  pool_cap_sensitivity: [250]         # nested pool prefix, smallest budget only
  pool_cap_sensitivity_policies: [low_confidence]

selection:
  policies: [random, low_confidence, high_entropy]
  batch_size: 20
  budgets: [100]                      # selected verbs incl. the seed; core verbs are extra and shared
  selector: ldl                       # LDL (JudiLing) selector; the Transformer is not used in pcfp_v1
  candidate_scoring: citation_row     # candidate known through one form: its citation label (rank-one update)
  semantic_seeds: 3                   # scores averaged over the evaluated semantic seed + 2 selector seeds
  entropy_temperature: 0.02           # weights = softmax(support / T) over the top max_can candidates;
                                      # 0.1 -> 0.02 before any real selection (user decision after the review: at 0.1
                                      # entropy tracked log(#candidates), r = 0.94; smoke score distributions only)
  no_candidate_support: -1.0          # a cell with no decoded candidate counts as support -1 (most uncertain)
  aggregation: mean_cell              # lemma score = mean over its pre-drawn shown cells, then over seeds
  random_trains_selector: false
  n_procs: 6                          # parallel acquisition jobs (one Julia selector process each)
  julia_threads: 1                    # threads per selector process

ldl:
  # cue_ngram and sem_sd_inflection are chosen once by `ldl_tune` on auxiliary (non-inventory)
  # verbs under core-like partial exposure, before any selection; values here are placeholders.
  cue_ngram: 2
  sem_sd_inflection: 0.4
  tune:
    grid: {cue_ngram: [2, 3], sem_sd_inflection: [0.4, 1.0, 2.0, 4.0]}   # 2.0 added after the toy check (LDL_PROTOCOL §6)
    boundary_rule: >
      if the chosen sem_sd_inflection is at an edge of the grid, the grid is extended one step
      outward (0.1 below, 10.0 above) and the stage is re-run before any selection
    fold: -1                          # labels the tuning fits' semantic seed; -1 = a seed no outer fold uses
    repetition: 0
    core_size: 100                    # auxiliary verbs whose hidden cells are scored
    extra_size: 100                   # auxiliary verbs that only add shown forms (like selected verbs)
    criterion: mean_heldout_accuracy_over_units   # tie-break: lower mean edit distance
  boundary: "#"
  sem_dim: 1000
  sem_sd_lexeme: 4.0
  sem_sd_noise: 1.0
  sem_isdeep: false
  ridge_shift: 0.02
  adjacency: full
  decoder: learn_paths
  threshold: 0.05
  tolerance: false
  max_can: 10
  max_t_margin: 4                     # max_t = longest training form + margin (no gold)
  predict_chunk: 400                  # items per learn_paths call (results do not depend on it)
  n_procs: 4

evaluation:
  bootstrap_reps: 2000
  ci_level: 0.95

limits:
  max_threads: 8
  julia_threads: 4

# Grambank inflection-extent outcome (primary admixture outcome; docs/TYPOLOGY.md). Declared before
# any linkage output for pcfp_v1 was written.
typology:
  sources:
    grambank:
      path: external/grambank            # scripts/fetch_external.sh
      repo: https://github.com/grambank/grambank
      tag: v1.0.3
      commit: 7ae000cf740f93cdb3e4ec67010668d6795337a9
      doi: 10.5281/zenodo.7844558
    glottolog:
      path: external/glottolog-cldf      # scripts/fetch_external.sh
      repo: https://github.com/glottolog/glottolog-cldf
      tag: v5.3
      commit: 072ca0d0410039fb8b779be8fc165bac575d2cda
    gelato_main_populations:            # main_397 panel (population metadata only)
      path: analyses/gelato_feasibility_2026_10_01/sources/gelato_c625fdc/cldf/populations.csv
      origin: https://github.com/gelato-org/gelato-data
      version: c625fdcf0225142cc03ae3a1635edf322e9c7778
    gelato_tableS1:                     # expanded_558 panel (population metadata only)
      path: analyses/gelato_feasibility_2026_10_01/sources/zenodo_15263706/geneticAdmixture-linguisticDiffusion/tables/tableS1.csv
      origin: https://zenodo.org/records/15263706
      version: zenodo:15263706
  review_file: morph_ldl/data/gelato_review.yaml   # same reviews as the data-stage crosswalk
  manual_links: []        # [{population, glottocode, reason, by}] -> link_basis "manual" (initial match only)
  # Read-only list of MGN resources for the LDL-eligibility overlap report. null = use
  # outputs/<experiment>/eligibility/broad_audit.csv if present.
  ldl_eligibility_audit: null
  ldl_eligibility_levels: [suitable, suitable_with_caveats, limited]
  feature_set:
    id: grambank_core_inflection_35_v1
    n_features: 35
    domains:                             # domain -> Grambank parameter IDs
      verbal_tam: [GB079, GB080, GB082, GB083, GB084, GB086, GB312]
      person_indexing: [GB089, GB090, GB091, GB092, GB093, GB094]
      neg_interrog: [GB107, GB286]
      nominal_number: [GB042, GB043, GB044, GB165, GB166]
      case: [GB070, GB071, GB072, GB073]
      possession: [GB430, GB431, GB432, GB433]
      agreement: [GB170, GB171, GB172, GB184, GB185, GB186, GB198]
    excluded:                            # declared exclusions (must not overlap the domains)
      derivation: [GB047, GB048, GB049]
      diminutive_augmentative: [GB187, GB188]
      auxiliary_verbs: [GB119, GB120, GB121, GB298]
      valency_voice: [GB103, GB104, GB113, GB147, GB148, GB155]
      bound_comparative: [GB275]
    # Codes (codes.csv `Name`) counted as "present". All 35 features are binary {0,1} in
    # v1.0.3; a multistate feature must get an explicit entry under `per_feature`, otherwise
    # the stage refuses to run. '?' and absent rows are "not coded".
    present_codes:
      default: ["1"]
      per_feature: {}
  sensitivity_sets:                      # name -> domains (each a subset of the main set)
    verbal: [verbal_tam, person_indexing, neg_interrog]
    nominal: [nominal_number, case, possession]
    no_agreement: [verbal_tam, person_indexing, neg_interrog, nominal_number, case, possession]
  coverage_threshold: 0.6                # main analysis: coverage = n_coded / n_features
  report_coverage_thresholds: [0.5, 0.75]
  minimal_inflection_max: 1              # minimal_inflection: n_present <= 1 (main set)
  clitic_heuristic:
    # Flag only; Grambank values are never recoded. See docs/TYPOLOGY.md §5.
    analytic_families: [sino1245, taik1256, hmon1336, aust1305]   # Sino-Tibetan, Tai-Kadai, Hmong-Mien, Austroasiatic
    analytic_family_min_present: 5       # family flag needs n_present >= this (main set)
    profile_min_present: 5               # profile flag: n_present >= this ...
    profile_zero_domains: [nominal_number, agreement]   # ... and none of these domains present ...
    profile_min_domain_coverage: 0.5     # ... each coded on >= 50% of its features
